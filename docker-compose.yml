services:
  # 1. API y Dashboard Web (BIOT UAO - FastAPI)
  api:
    build: .
    container_name: salud_predictiva_api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${DB_HOST:-app-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-uci_telemetria}
      - DB_USER=${DB_USER:-admin}
      - DB_PASS=${DB_PASS:-adminpassword}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/uci_contabilidad}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-uci_contabilidad}
      - HAPI_FHIR_URL=${HAPI_FHIR_URL:-http://hapi-fhir:8080/fhir}
      - ORTHANC_PACS_URL=${ORTHANC_PACS_URL:-http://orthanc-pacs:8042}
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://ml:8001}
      - SESSION_SECRET=${SESSION_SECRET:-dev-only-session-secret-change-in-production}
      - PORT=8000
    depends_on:
      - app-db
      - mongo
      - ml
    restart: unless-stopped

  # 2. Base de datos PostgreSQL Nativa (Modelo Relacional Telemetría UCI)
  app-db:
    image: postgres:15-alpine
    container_name: uci_app_db
    environment:
      POSTGRES_DB: ${DB_NAME:-uci_telemetria}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASS:-adminpassword}
    ports:
      - "5433:5432"
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
      - app_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 3. Base de datos Documental MongoDB para Contabilidad UCI (R04, R09)
  mongo:
    image: mongo:7.0
    container_name: uci_mongo_contabilidad
    ports:
      - "27017:27017"
    volumes:
      - mongo_contabilidad_data:/data/db
    restart: unless-stopped

  # 4. Microservicio de Inferencia Machine Learning Multi-Objetivo (R04, R10, R12)
  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    container_name: uci_ml_biomedico
    ports:
      - "8001:8001"
    restart: unless-stopped

  # 5. Visor de Base de Datos Web (Adminer)
  adminer:
    image: adminer:latest
    container_name: uci_adminer
    ports:
      - "8081:8080"
    depends_on:
      - app-db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 6. Base de datos para HAPI FHIR
  fhir-db:
    image: postgres:15-alpine
    container_name: hapi_fhir_db
    environment:
      POSTGRES_DB: hapifhir
      POSTGRES_USER: fhiruser
      POSTGRES_PASSWORD: fhirpassword
    ports:
      - "5432:5432"
    volumes:
      - fhir_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 7. Servidor HAPI FHIR R4 (R04, R15, R21)
  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: hapi_fhir_server
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      spring.datasource.url: jdbc:postgresql://fhir-db:5432/hapifhir
      spring.datasource.username: fhiruser
      spring.datasource.password: fhirpassword
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      - fhir-db
    restart: unless-stopped

  # 8. Servidor PACS Orthanc (Almacenamiento de Imágenes Biomédicas R04, R06)
  orthanc-pacs:
    image: jodogne/orthanc-plugins:latest
    container_name: uci_orthanc_pacs
    ports:
      - "8042:8042"
      - "4242:4242"
    volumes:
      - orthanc_pacs_data:/var/lib/orthanc/db
    restart: unless-stopped

  # 9. Reverse Proxy Nginx con soporte SSE sin buffering (R04, R05)
  nginx:
    image: nginx:1.25-alpine
    container_name: uci_nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  # 10. Exposición Pública con Cloudflare Tunnel (R05)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: uci_cloudflare_tunnel
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  app_db_data:
  mongo_contabilidad_data:
  fhir_db_data:
  orthanc_pacs_data: