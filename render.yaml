services:
  - type: web
    name: salud-digital-telemetria-uci
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn middleware.app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
